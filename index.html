<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UoT Exam Duty Scheduler</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* --- General Styles & Variables --- */
        :root {
            --color-bg-dark: #1e1e2f;
            --color-bg-card: rgba(255, 255, 255, 0.05); /* Glass base */
            --color-border-card: rgba(255, 255, 255, 0.1);
            --color-primary: #8a2be2; /* BlueViolet */
            --color-secondary: #00bcd4; /* Cyan */
            --color-text-light: #f0f0f5;
            --color-text-muted: #a0a0b0;
            --color-error: #ff4757;
            --shadow-glass: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            --font-main: 'Outfit', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
            --max-width: 1300px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background: linear-gradient(135deg, var(--color-bg-dark) 0%, #101018 100%);
            color: var(--color-text-light);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: var(--max-width);
        }

        /* --- Glass Panel Base Styling --- */
        .glass-panel {
            background: var(--color-bg-card);
            border-radius: 16px;
            box-shadow: var(--shadow-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--color-border-card);
            padding: 20px;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        /* --- Typography --- */
        h1 {
            font-family: var(--font-display);
            color: var(--color-primary);
            text-align: center;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 1.5px;
            font-size: 2.5em;
        }

        h2 {
            font-family: var(--font-display);
            color: var(--color-secondary);
            border-bottom: 2px solid var(--color-border-card);
            padding-bottom: 8px;
            margin-bottom: 15px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
        }

        h2 i {
            margin-right: 10px;
            color: var(--color-primary);
        }

        /* --- Form Elements --- */
        input[type="text"], input[type="number"], select {
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--color-border-card);
            border-radius: 8px;
            padding: 10px;
            color: var(--color-text-light);
            font-family: var(--font-main);
            transition: border-color 0.3s;
            width: 100%;
        }

        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 5px var(--color-primary);
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--color-text-muted);
            font-weight: 600;
            font-size: 0.9em;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            align-items: flex-end;
        }

        .form-group {
            flex: 1;
        }

        /* --- Buttons --- */
        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s, transform 0.2s;
            white-space: nowrap;
        }

        .btn-primary {
            background-color: var(--color-primary);
            color: var(--color-text-light);
        }

        .btn-primary:hover {
            background-color: #9b4dff;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background-color: var(--color-secondary);
            color: var(--color-bg-dark);
        }

        .btn-secondary:hover {
            background-color: #00e0ff;
            transform: translateY(-2px);
        }

        .btn i {
            margin-right: 5px;
        }

        /* --- Layout Grids --- */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        /* --- Staff List --- */
        #staffList {
            list-style: none;
        }

        #staffList li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed var(--color-border-card);
            font-size: 0.95em;
        }

        #staffList li:last-child {
            border-bottom: none;
        }
        
        .staff-name {
            font-weight: 600;
            color: var(--color-secondary);
        }

        .staff-capacity {
            color: var(--color-text-light);
        }

        .total-capacity-info {
            margin-top: 15px;
            padding: 10px;
            background-color: rgba(138, 43, 226, 0.1);
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.1em;
            display: flex;
            justify-content: space-between;
        }

        /* --- Exam Matrix Config --- */
        .exam-day-config {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid var(--color-secondary);
            border-radius: 12px;
            background-color: rgba(0, 188, 212, 0.05);
        }
        
        .exam-day-config h3 {
            color: var(--color-secondary);
            margin-bottom: 10px;
            font-size: 1.2em;
        }
        
        .slot-input-group {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr 1fr 1fr; /* Icon, Subject, Sections, Staff/Section, Load */
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
            font-size: 0.9em;
        }
        
        .slot-input-group label {
            text-align: center;
            color: var(--color-text-light);
            font-weight: 400;
            font-size: 1em;
        }

        .slot-icon {
            text-align: center;
            font-size: 1.2em;
        }
        
        /* The header for the matrix */
        .slot-input-header {
            color: var(--color-primary);
            font-weight: 600;
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--color-border-card);
        }
        
        .slot-input-header label {
            color: var(--color-primary);
            font-size: 0.9em;
            font-weight: 700;
        }

        /* --- Schedule Output --- */
        #scheduleOutput {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .schedule-card {
            background-color: rgba(138, 43, 226, 0.1);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid var(--color-primary);
            position: relative;
            overflow: hidden;
        }

        .schedule-card::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            width: 40px;
            height: 40px;
            background: var(--color-primary);
            border-radius: 50%;
            opacity: 0.3;
            filter: blur(5px);
        }
        
        .schedule-card h4 {
            font-family: var(--font-display);
            color: var(--color-secondary);
            margin-bottom: 5px;
            font-size: 1.1em;
        }
        
        .schedule-card p {
            margin: 3px 0;
            font-size: 0.9em;
        }

        .schedule-card .day-slot-info {
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 10px;
            border-bottom: 1px dotted var(--color-border-card);
            padding-bottom: 5px;
        }

        .schedule-card .staff-assigned {
            margin-top: 8px;
            font-weight: 700;
            color: var(--color-text-light);
            font-size: 1em;
            background-color: rgba(138, 43, 226, 0.2);
            padding: 5px;
            border-radius: 5px;
            display: inline-block;
        }

        /* --- Analytics View --- */
        #analyticsView {
            padding: 20px 0;
        }

        .analytics-card {
            background-color: rgba(0, 188, 212, 0.05);
            border: 1px solid var(--color-secondary);
            padding: 15px;
            border-radius: 10px;
        }
        
        .staff-workload-bar {
            margin-bottom: 10px;
        }
        
        .bar-label {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 0.9em;
            margin-bottom: 5px;
            color: var(--color-secondary);
        }
        
        .bar-container {
            height: 15px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        
        .bar-fill {
            height: 100%;
            background-color: var(--color-primary);
            transition: width 1s ease-out;
            border-radius: 8px 0 0 8px;
        }

        /* --- Responsiveness --- */
        @media (max-width: 768px) {
            .form-row, .grid-2, .grid-3 {
                display: block;
                gap: 0;
            }

            .form-group, .glass-panel {
                margin-bottom: 15px;
            }

            .btn {
                width: 100%;
                margin-top: 10px;
            }
            
            .slot-input-group {
                grid-template-columns: 1fr 1fr;
            }
            
            .slot-input-group label {
                text-align: left;
            }
            
            .slot-icon, .slot-input-group input {
                grid-column: span 1;
            }
            
            .slot-input-header {
                display: none; /* Hide complex header on mobile */
            }
        }
        
        /* --- Utility Classes --- */
        .hidden {
            display: none !important;
        }
        
        .text-error {
            color: var(--color-error);
            font-weight: 600;
            margin-top: 10px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-calendar-check"></i> UoT Exam Duty Scheduler</h1>
        
        <div class="glass-panel">
            <h2><i class="fas fa-users-gear"></i> Staff Configuration</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="staffName">Staff Name</label>
                    <input type="text" id="staffName" placeholder="e.g., Prof. Aslam">
                </div>
                <div class="form-group">
                    <label for="staffCapacity">Max Duties (Capacity)</label>
                    <input type="number" id="staffCapacity" value="5" min="1" max="50">
                </div>
                <button class="btn btn-primary" id="addStaffBtn"><i class="fas fa-user-plus"></i> Add Staff</button>
            </div>
            
            <ul id="staffList">
                </ul>
            <div class="total-capacity-info hidden" id="totalCapacityInfo">
                <span>Total Staff Capacity:</span>
                <span id="totalCapacityValue">0</span>
            </div>
        </div>
        
        <div class="glass-panel">
            <h2><i class="fas fa-clipboard-list"></i> Exam Matrix Configuration</h2>
            
            <div class="form-row">
                <div class="form-group" style="flex: 0 0 200px;">
                    <label for="nDays">Total Exam Days</label>
                    <input type="number" id="nDays" value="3" min="1" max="15">
                </div>
                <div class="form-group">
                    </div>
                <button class="btn btn-primary" id="generateBtn"><i class="fas fa-wand-magic-sparkles"></i> Generate Schedule</button>
                <button class="btn btn-secondary hidden" id="exportBtn"><i class="fas fa-file-csv"></i> Export CSV</button>
            </div>
            
            <div id="examMatrixConfig">
                </div>
            <p class="text-error hidden" id="scheduleError"></p>
        </div>
        
        <div class="glass-panel hidden" id="schedulePanel">
            <h2><i class="fas fa-calendar-alt"></i> Generated Schedule</h2>
            <div id="scheduleOutput">
                </div>
        </div>

        <div class="glass-panel hidden" id="analyticsPanel">
            <h2><i class="fas fa-chart-bar"></i> Workload Analytics</h2>
            <div id="analyticsView">
                <div class="analytics-card" id="workloadChart">
                    </div>
            </div>
        </div>

    </div>

    <script>
        // PRESET_CONFIG is now empty, so the app starts fresh.
        const PRESET_CONFIG = []; 

        let staff = []; // { name: string, capacity: number, assigned: number, slotCounts: [m, mid, e] }
        let examMatrix = []; 

        const DOM = {
            staffName: document.getElementById('staffName'),
            staffCapacity: document.getElementById('staffCapacity'),
            addStaffBtn: document.getElementById('addStaffBtn'),
            staffList: document.getElementById('staffList'),
            totalCapacityInfo: document.getElementById('totalCapacityInfo'),
            totalCapacityValue: document.getElementById('totalCapacityValue'),
            nDays: document.getElementById('nDays'),
            examMatrixConfig: document.getElementById('examMatrixConfig'),
            generateBtn: document.getElementById('generateBtn'),
            exportBtn: document.getElementById('exportBtn'),
            schedulePanel: document.getElementById('schedulePanel'),
            scheduleOutput: document.getElementById('scheduleOutput'),
            analyticsPanel: document.getElementById('analyticsPanel'),
            workloadChart: document.getElementById('workloadChart'),
            scheduleError: document.getElementById('scheduleError')
        };
        
        const SLOT_NAMES = [
            { id: 0, name: 'Morning (09:00-11:00)', icon: 'fa-sun' },
            { id: 1, name: 'Midday (11:30-01:10)', icon: 'fa-cloud-sun' },
            { id: 2, name: 'Evening (02:00-04:00)', icon: 'fa-moon' }
        ];

        /* --- 1. Staff Management --- */

        function updateStaffList() {
            DOM.staffList.innerHTML = '';
            let totalCapacity = 0;
            
            staff.forEach((s, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span class="staff-name">${s.name}</span>
                    <span class="staff-capacity">Capacity: ${s.capacity} 
                        <i class="fas fa-trash-alt" data-index="${index}" style="margin-left: 10px; color: var(--color-error); cursor: pointer;"></i>
                    </span>
                `;
                DOM.staffList.appendChild(li);
                totalCapacity += s.capacity;
            });

            if (staff.length > 0) {
                DOM.totalCapacityInfo.classList.remove('hidden');
                DOM.totalCapacityValue.textContent = totalCapacity;
            } else {
                DOM.totalCapacityInfo.classList.add('hidden');
            }
        }
        
        function addStaff() {
            const name = DOM.staffName.value.trim();
            const capacity = parseInt(DOM.staffCapacity.value);

            if (!name || isNaN(capacity) || capacity < 1) {
                alert('Please enter a valid staff name and capacity (Capacity must be 1 or more).');
                return;
            }

            if (staff.some(s => s.name.toLowerCase() === name.toLowerCase())) {
                alert('Staff member already exists.');
                return;
            }

            // capacity is max duties allowed. assigned is current duties. slotCounts tracks duties per slot.
            staff.push({ name, capacity, assigned: 0, slotCounts: [0, 0, 0] }); 
            
            DOM.staffName.value = '';
            DOM.staffCapacity.value = '5';
            
            updateStaffList();
        }

        function removeStaff(index) {
            staff.splice(index, 1);
            updateStaffList();
        }

        DOM.addStaffBtn.addEventListener('click', addStaff);
        DOM.staffList.addEventListener('click', (e) => {
            if (e.target.classList.contains('fa-trash-alt')) {
                const index = parseInt(e.target.dataset.index);
                removeStaff(index);
            }
        });

        /* --- 2. Exam Matrix Management (Dynamic Rendering) --- */

        function updateExamMatrixStructure() {
            const nDays = parseInt(DOM.nDays.value);
            if (isNaN(nDays) || nDays < 1) return;

            // Update examMatrix size to match nDays
            while (examMatrix.length < nDays) {
                // Add a new day with default 3 slots (empty)
                examMatrix.push([
                    { subject: '', sections: 1, staffPerSection: 1, load: 1 },
                    { subject: '', sections: 1, staffPerSection: 1, load: 1 },
                    { subject: '', sections: 1, staffPerSection: 1, load: 1 }
                ]);
            }
            examMatrix = examMatrix.slice(0, nDays);
            
            renderExamMatrixInputs();
        }

        function renderExamMatrixInputs() {
            DOM.examMatrixConfig.innerHTML = '';
            
            const nDays = examMatrix.length;

            for (let day = 0; day < nDays; day++) {
                const dayConfigDiv = document.createElement('div');
                dayConfigDiv.classList.add('exam-day-config');
                dayConfigDiv.innerHTML = `<h3>Day ${day + 1}</h3>`;
                
                // Header for the slots
                const headerDiv = document.createElement('div');
                headerDiv.classList.add('slot-input-group', 'slot-input-header');
                headerDiv.innerHTML = `
                    <label></label>
                    <label>Subject Name</label>
                    <label>Sections</label>
                    <label>Staff/Section</label>
                    <label>Load</label>
                `;
                dayConfigDiv.appendChild(headerDiv);

                examMatrix[day].forEach((slotData, slotId) => {
                    const slot = SLOT_NAMES[slotId];
                    const slotDiv = document.createElement('div');
                    slotDiv.classList.add('slot-input-group');
                    
                    slotDiv.innerHTML = `
                        <div class="slot-icon" title="${slot.name}"><i class="fas ${slot.icon}"></i></div>
                        <input type="text" data-day="${day}" data-slot="${slotId}" data-field="subject" placeholder="Subject Name" value="${slotData.subject}">
                        <input type="number" data-day="${day}" data-slot="${slotId}" data-field="sections" value="${slotData.sections}" min="1">
                        <input type="number" data-day="${day}" data-slot="${slotId}" data-field="staffPerSection" value="${slotData.staffPerSection}" min="1">
                        <input type="number" data-day="${day}" data-slot="${slotId}" data-field="load" value="${slotData.load}" readonly title="Sections x Staff/Section">
                    `;
                    dayConfigDiv.appendChild(slotDiv);
                });

                DOM.examMatrixConfig.appendChild(dayConfigDiv);
            }
            
            // Attach event listeners to new inputs
            DOM.examMatrixConfig.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', updateMatrixData);
            });
        }
        
        function updateMatrixData(event) {
            const input = event.target;
            const day = parseInt(input.dataset.day);
            const slot = parseInt(input.dataset.slot);
            const field = input.dataset.field;
            let value = input.value;
            
            if (field !== 'subject') {
                value = parseInt(value);
                if (isNaN(value) || value < 1) return;
            }

            examMatrix[day][slot][field] = value;
            
            // Recalculate Load (Total Duties)
            if (field === 'sections' || field === 'staffPerSection') {
                const data = examMatrix[day][slot];
                const newLoad = data.sections * data.staffPerSection;
                data.load = newLoad;
                // Update the readonly load input field
                DOM.examMatrixConfig.querySelector(`input[data-day="${day}"][data-slot="${slot}"][data-field="load"]`).value = newLoad;
            }
        }
        
        DOM.nDays.addEventListener('input', updateExamMatrixStructure);

        /* --- 3. Scheduling Logic --- */

        function generateSchedule() {
            DOM.scheduleError.classList.add('hidden');
            // Reset staff stats
            staff.forEach(s => {
                s.assigned = 0;
                s.slotCounts = [0, 0, 0];
                s.available = true; // Temporary flag for daily availability
            });

            // Flatten all duties into a single list
            const allDuties = [];
            examMatrix.forEach((daySlots, dayIndex) => {
                daySlots.forEach((slotData, slotId) => {
                    // Create an individual duty object for each required 'load'
                    if (slotData.load > 0 && slotData.subject.trim() !== '') {
                        for (let i = 0; i < slotData.load; i++) {
                            allDuties.push({
                                day: dayIndex + 1,
                                slotId: slotId,
                                slotName: SLOT_NAMES[slotId].name,
                                subject: slotData.subject,
                                assignedStaff: null // Will be filled by the algorithm
                            });
                        }
                    }
                });
            });

            const totalDuties = allDuties.length;
            const totalCapacity = staff.reduce((sum, s) => sum + s.capacity, 0);

            if (totalDuties === 0) {
                DOM.scheduleError.textContent = 'The Exam Matrix is empty or subjects are missing. Please configure duties.';
                DOM.scheduleError.classList.remove('hidden');
                return;
            }

            if (staff.length === 0) {
                DOM.scheduleError.textContent = 'No staff members have been added. Please add staff and capacity.';
                DOM.scheduleError.classList.remove('hidden');
                return;
            }

            if (totalCapacity < totalDuties) {
                DOM.scheduleError.textContent = `Total required duties (${totalDuties}) exceed total staff capacity (${totalCapacity}). Schedule is impossible.`;
                DOM.scheduleError.classList.remove('hidden');
                return;
            }
            
            // Group duties by day for processing
            const dutiesByDay = allDuties.reduce((acc, duty) => {
                const dayKey = duty.day;
                if (!acc[dayKey]) {
                    acc[dayKey] = [];
                }
                acc[dayKey].push(duty);
                return acc;
            }, {});

            let successfulAssignments = 0;

            // Iterate day by day
            for (const day in dutiesByDay) {
                // Reset daily availability
                staff.forEach(s => s.available = true);

                // Sort duties within the day to prioritize Morning -> Midday -> Evening
                dutiesByDay[day].sort((a, b) => a.slotId - b.slotId);

                dutiesByDay[day].forEach(duty => {
                    // 1. Filter: Staff must be available (not assigned today) and under capacity
                    let eligibleStaff = staff.filter(s => s.available && s.assigned < s.capacity);

                    if (eligibleStaff.length === 0) {
                        console.error(`Day ${duty.day}, Slot ${duty.slotId}: No eligible staff remaining.`);
                        return; // Skip this duty
                    }

                    // 2. Fairness Constraint (Slot Balancing): Prioritize staff who have worked the LEAST in this slot type
                    eligibleStaff.sort((a, b) => {
                        const slotCountA = a.slotCounts[duty.slotId];
                        const slotCountB = b.slotCounts[duty.slotId];
                        
                        if (slotCountA !== slotCountB) {
                            return slotCountA - slotCountB; // Least slot duties first
                        }

                        // 3. Tiebreaker: Prioritize teacher with HIGHEST remaining capacity (least busy overall)
                        const remainingCapacityA = a.capacity - a.assigned;
                        const remainingCapacityB = b.capacity - b.assigned;
                        
                        return remainingCapacityB - remainingCapacityA; // Highest remaining capacity first (B - A)
                    });
                    
                    const chosenStaff = eligibleStaff[0];

                    if (chosenStaff) {
                        // Assign duty
                        duty.assignedStaff = chosenStaff.name;
                        chosenStaff.assigned++;
                        chosenStaff.slotCounts[duty.slotId]++;
                        chosenStaff.available = false; // Cannot be assigned another duty on this day
                        successfulAssignments++;
                    }
                });
            }

            if (successfulAssignments < totalDuties) {
                 DOM.scheduleError.textContent = `Only ${successfulAssignments} of ${totalDuties} duties were assigned. Check capacity, matrix, and staffing rules.`;
                 DOM.scheduleError.classList.remove('hidden');
            } else {
                DOM.scheduleError.classList.add('hidden');
            }

            // Render output
            renderScheduleOutput(allDuties);
            renderAnalytics(allDuties);
        }

        /* --- 4. Output Rendering and Export --- */

        function renderScheduleOutput(duties) {
            DOM.scheduleOutput.innerHTML = '';
            
            // Sort duties by Day, then SlotId
            duties.sort((a, b) => {
                if (a.day !== b.day) return a.day - b.day;
                return a.slotId - b.slotId;
            });
            
            duties.forEach(duty => {
                if (duty.assignedStaff) {
                    const card = document.createElement('div');
                    card.classList.add('schedule-card');
                    
                    card.innerHTML = `
                        <p class="day-slot-info">Day ${duty.day} - ${duty.slotName}</p>
                        <h4><i class="fas fa-book-open"></i> ${duty.subject}</h4>
                        <p class="staff-assigned"><i class="fas fa-user-check"></i> ${duty.assignedStaff}</p>
                    `;
                    DOM.scheduleOutput.appendChild(card);
                }
            });
            
            DOM.schedulePanel.classList.remove('hidden');
            DOM.exportBtn.classList.remove('hidden');
        }

        function renderAnalytics() {
            DOM.workloadChart.innerHTML = '<h3>Workload Percentage (Assigned / Capacity)</h3>';

            staff.sort((a, b) => (b.assigned / b.capacity) - (a.assigned / a.capacity)); // Sort by workload % descending

            staff.forEach(s => {
                const workloadPercent = s.capacity > 0 ? ((s.assigned / s.capacity) * 100).toFixed(1) : 0;
                
                const bar = document.createElement('div');
                bar.classList.add('staff-workload-bar');
                
                bar.innerHTML = `
                    <div class="bar-label">
                        <span>${s.name} (Cap: ${s.capacity})</span>
                        <span>${s.assigned} duties - ${workloadPercent}%</span>
                    </div>
                    <div class="bar-container">
                        <div class="bar-fill" style="width: ${workloadPercent}%;"></div>
                    </div>
                `;
                DOM.workloadChart.appendChild(bar);
            });
            
            DOM.analyticsPanel.classList.remove('hidden');
        }

        function exportToCSV() {
            if (staff.length === 0 || DOM.scheduleOutput.children.length === 0) {
                alert('Generate a schedule first.');
                return;
            }

            // Simple extraction of rendered data for CSV
            const scheduleData = Array.from(DOM.scheduleOutput.children).map(card => {
                const daySlotText = card.querySelector('.day-slot-info').textContent;
                const subject = card.querySelector('h4').textContent.replace(/[\u2600-\u26FF\u2700-\u27BF] /g, '').trim(); 
                const assignedStaff = card.querySelector('.staff-assigned').textContent.replace(/[\u2600-\u26FF\u2700-\u27BF] /g, '').trim(); 
                
                const [dayPart, slotPart] = daySlotText.split(' - ');
                return {
                    Day: dayPart.replace('Day ', ''),
                    Slot: slotPart,
                    Subject: subject,
                    Staff: assignedStaff
                };
            });
            
            // Add staff workload data
            const workloadData = staff.map(s => ({
                Staff: s.name,
                AssignedDuties: s.assigned,
                Capacity: s.capacity,
                WorkloadPercent: s.capacity > 0 ? ((s.assigned / s.capacity) * 100).toFixed(1) + '%' : '0%',
                MorningDuties: s.slotCounts[0],
                MiddayDuties: s.slotCounts[1],
                EveningDuties: s.slotCounts[2]
            }));

            // Header for Schedule
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "--- SCHEDULE ---\r\n";
            csvContent += "Day,Slot,Subject,Assigned Staff\r\n";
            
            scheduleData.forEach(d => {
                csvContent += `${d.Day},"${d.Slot}","${d.Subject}","${d.Staff}"\r\n`;
            });
            
            // Header for Analytics
            csvContent += "\r\n--- WORKLOAD ANALYTICS ---\r\n";
            csvContent += "Staff,Assigned Duties,Capacity,Workload Percent,Morning Duties,Midday Duties,Evening Duties\r\n";
            
            workloadData.forEach(s => {
                csvContent += `${s.Staff},${s.AssignedDuties},${s.Capacity},${s.WorkloadPercent},${s.MorningDuties},${s.MiddayDuties},${s.EveningDuties}\r\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "exam_schedule.csv");
            document.body.appendChild(link);
            link.click();
            link.remove();
        }

        DOM.generateBtn.addEventListener('click', generateSchedule);
        DOM.exportBtn.addEventListener('click', exportToCSV);


        /* --- Initial Setup --- */
        function init() {
            // Staff array is intentionally left empty.
            
            DOM.nDays.value = 3; // Default to 3 days
            updateExamMatrixStructure(); // Render the 3-day matrix with empty slots
        }

        window.onload = init;

    </script>
</body>
